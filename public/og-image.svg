<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Mimic — Browser execution, without the browser</title>
  <desc id="desc">Mimic runs website JavaScript and exposes Chrome-visible state through CDP without embedding Chromium.</desc>
  <rect width="1200" height="630" fill="#101719" />
  <rect x="38" y="38" width="1124" height="554" rx="12" fill="#182125" stroke="#344147" stroke-width="2" />
  <text x="80" y="116" fill="#f0f3f7" font-family="Segoe UI, Arial, sans-serif" font-size="48" font-weight="700" letter-spacing="-3">mimic</text>
  <text x="1120" y="108" fill="#adb8c3" font-family="Segoe UI, Arial, sans-serif" font-size="18" text-anchor="end">PUBLIC BETA</text>
  <path d="M80 155 H1120" stroke="#344147" stroke-width="2" />
  <path d="M80 155 H260" stroke="#6bb5ff" stroke-width="3" />
  <text x="80" y="282" fill="#f0f3f7" font-family="Segoe UI, Arial, sans-serif" font-size="76" font-weight="700" letter-spacing="-4">Browser execution,</text>
  <text x="80" y="370" fill="#f0f3f7" font-family="Segoe UI, Arial, sans-serif" font-size="76" font-weight="700" letter-spacing="-4">without the browser.</text>
  <text x="82" y="447" fill="#adb8c3" font-family="Segoe UI, Arial, sans-serif" font-size="27">Run website JavaScript and automate Chrome-visible state</text>
  <text x="82" y="486" fill="#adb8c3" font-family="Segoe UI, Arial, sans-serif" font-size="27">through CDP, without embedding Chromium.</text>
  <circle cx="88" cy="546" r="5" fill="#6bb5ff" />
  <text x="105" y="553" fill="#8ec6ff" font-family="Segoe UI, Arial, sans-serif" font-size="19">Chrome 152 reference</text>
</svg>
